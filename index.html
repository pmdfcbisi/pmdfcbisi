<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMD-FC BISI — Dashboard Gate</title>
<meta name="theme-color" content="#1f4d29">
<style>
:root{--ink:#1d2a1f;--mute:#5d6b5f;--line:#d9e0d4;--green:#2f6b3a;--green-d:#1f4d29;--green-l:#e3efdf}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
background:linear-gradient(90deg,#e7f1e2 0%,#eef3e4 38%,#f4f1dc 62%,#f6efd2 100%);background-attachment:fixed;background-color:#f4f6f2}
header{background:linear-gradient(90deg,#1f4d29,#2f6b3a);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px #0003}
.logo{height:clamp(40px,8vw,62px);aspect-ratio:1/1;background:#fff;border-radius:8px;padding:3px;display:block;flex:none}
header h1{margin:0;font-size:clamp(15px,3vw,19px)}header small{display:block;opacity:.85;font-weight:400;font-size:12px}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:36px 16px 40px}
h2{font-size:15px;margin:0 0 4px}.lead{color:var(--mute);margin:0 0 18px}
a.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;transition:.15s;box-shadow:0 1px 3px #0001}
a.card:hover,a.card:focus-visible{border-color:var(--green);box-shadow:0 4px 14px #2f6b3a33;transform:translateY(-2px);outline:none}
.tag{align-self:flex-start;font-size:11px;background:var(--green-l);color:var(--green-d);border-radius:999px;padding:2px 9px;font-weight:600}
.card b{font-size:17px}.card span.d{color:var(--mute);font-size:13px}
.go{margin-top:6px;color:var(--green);font-weight:650;font-size:13px}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:22px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card span.d{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:600;font-size:14px;color:var(--mute);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--green-d)}
.tab[aria-selected=true]{color:var(--green-d);border-bottom-color:var(--green)}
.tab:focus-visible,.btn:focus-visible,.more:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.msg,.empty{color:var(--mute);margin:8px 0}
#news-list,#event-list{display:grid;gap:12px;max-width:760px}
.news,.ev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px #0001}
.news h3,.ev h3{margin:6px 0 4px;font-size:16px}
.news p,.ev p{margin:0 0 6px;color:var(--mute);font-size:14px;white-space:pre-line}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.pill{border-radius:999px;padding:2px 9px;font-weight:600;font-size:11px}
.pill.new{background:#f6efd2;color:#6b5a12}.pill.pin{background:var(--green);color:#fff}
.more{color:var(--green);font-weight:650;font-size:13px;text-decoration:none}
.more:hover{text-decoration:underline}
.month{margin:14px 0 0;font-size:13px;color:var(--green-d);text-transform:capitalize}
.ev{display:grid;grid-template-columns:60px 1fr;gap:14px}
.ev.past{opacity:.6}
.dt{background:var(--green-l);color:var(--green-d);border-radius:10px;text-align:center;padding:8px 4px;align-self:start}
.dt b{display:block;font-size:22px;line-height:1.1}.dt span{font-size:11px;text-transform:uppercase}
.btn{font:inherit;font-size:13px;font-weight:600;color:var(--green-d);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;justify-self:start}
header h1{min-width:0}
.clock{margin-left:auto;text-align:right;flex:none;line-height:1.25}
#ck-date{font-size:12px;opacity:.9}
#ck-time{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.wx{background:#fff;color:var(--ink);text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 24px #0003}
.wx-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-d)}
.wx-loc{margin:6px 0 0;font-weight:650;font-size:15px}
.wx-main{display:flex;align-items:center;gap:12px;margin:10px 0 4px}
.wx-ic{font-size:44px;line-height:1}
.wx-t{font-size:36px;font-weight:700;line-height:1}
.wx-d{font-size:13px;color:var(--mute);margin:0}
.wx dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:10px 0 0;font-size:13px}
.wx dt{color:var(--mute)}.wx dd{margin:0;font-weight:600;text-align:right}
.wx-days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:12px;text-align:center;font-size:12px;color:var(--mute)}
.wx-days b{display:block;font-size:12px;color:var(--ink);text-transform:capitalize}
.wx-days i{display:block;font-style:normal;font-size:20px;margin:2px 0}
.wx .btn{margin-top:12px}
@media(max-width:560px){#ck-date{font-size:11px}#ck-time{font-size:15px}}
.clock{position:relative}
.wx-chip{display:inline-flex;align-items:center;max-width:230px;margin-top:4px;padding:2px 10px;font:inherit;font-size:12px;line-height:1.5;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx-chip:hover,.wx-chip[aria-expanded=true]{background:rgba(255,255,255,.28)}
.wx-chip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.wx-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:50;width:260px;max-width:calc(100vw - 24px)}
.wx-pop[hidden]{display:none}
@media(max-width:560px){.wx-chip{max-width:170px;font-size:11px}}
</style>
</head>

  <script>
  // ====== URL web app backend (…/exec) dari Apps Script yang terikat ke Google Sheet ======
  const API_URL = 'https://script.google.com/macros/s/AKfycbzIUafUutpMpP0qJEW5vNwK0TDC32A1agAAMTRJgPq0PBm5DOkwR01jAHyg5PD_t7Rz/exec';

  const $ = function (id) { return document.getElementById(id); };
  const fmtDate = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  const fmtMonth = new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' });
  const fmtMon = new Intl.DateTimeFormat('id-ID', { month: 'short' });

  function parseD(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function linkEl(url, label) {
    const a = el('a', 'more', label);
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    return a;
  }
  function setMsg(text) {
    ['news-list', 'event-list'].forEach(function (id) {
      $(id).textContent = '';
      $(id).appendChild(el('p', 'msg', text));
    });
  }

  /* ---------- Tab ---------- */
  function showPane(name) {
    ['dash', 'news', 'event'].forEach(function (k) {
      const on = k === name;
      $('p-' + k).hidden = !on;
      $('t-' + k).setAttribute('aria-selected', on ? 'true' : 'false');
    });
    history.replaceState(null, '', name === 'dash' ? location.pathname + location.search : '#' + name);
  }
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () { showPane(b.dataset.pane); });
  });

  /* ---------- News ---------- */
  function renderNews(items) {
    const box = $('news-list');
    box.textContent = '';
    if (!items.length) { box.appendChild(el('p', 'empty', 'Belum ada berita.')); return; }
    const now = new Date();
    items.map(function (n) { return Object.assign({ d: parseD(n.tgl) }, n); })
      .sort(function (a, b) { return (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || (b.d || 0) - (a.d || 0); })
      .forEach(function (n) {
        const it = el('article', 'news');
        const meta = el('div', 'meta');
        if (n.pin) meta.appendChild(el('span', 'pill pin', 'Disematkan'));
        if (n.kategori) meta.appendChild(el('span', 'tag', n.kategori));
        if (n.d && (now - n.d) / 864e5 <= 7) meta.appendChild(el('span', 'pill new', 'Baru'));
        if (n.d) meta.appendChild(el('span', null, fmtDate.format(n.d)));
        it.append(meta, el('h3', null, n.judul));
        if (n.isi) it.appendChild(el('p', null, n.isi));
        const u = safeUrl(n.link);
        if (u) it.appendChild(linkEl(u, 'Baca selengkapnya \u2192'));
        box.appendChild(it);
      });
  }

  /* ---------- Kalender ---------- */
  let EVENTS = [];
  let showPast = false;

  function renderEvents() {
    const box = $('event-list');
    box.textContent = '';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const all = EVENTS.map(function (e) {
      const s = parseD(e.mulai);
      return s ? Object.assign({}, e, { s: s, f: parseD(e.selesai) || s }) : null;
    }).filter(Boolean);
    const upcoming = all.filter(function (e) { return e.f >= today; }).sort(function (a, b) { return a.s - b.s; });
    const past = all.filter(function (e) { return e.f < today; }).sort(function (a, b) { return b.s - a.s; });

    if (!upcoming.length) box.appendChild(el('p', 'empty', 'Belum ada event mendatang.'));

    function draw(list, isPast) {
      let key = '';
      list.forEach(function (e) {
        const k = e.s.getFullYear() + '-' + e.s.getMonth();
        if (k !== key) { key = k; box.appendChild(el('h3', 'month', fmtMonth.format(e.s))); }
        const card = el('article', 'ev' + (isPast ? ' past' : ''));
        const dt = el('div', 'dt');
        dt.append(el('b', null, String(e.s.getDate())), el('span', null, fmtMon.format(e.s)));
        const body = el('div');
        const meta = el('div', 'meta');
        if (e.f > e.s) meta.appendChild(el('span', null, fmtDate.format(e.s) + ' – ' + fmtDate.format(e.f)));
        if (!isPast && e.s <= today && e.f >= today) meta.appendChild(el('span', 'pill new', 'Sedang berlangsung'));
        if (e.lokasi) meta.appendChild(el('span', null, e.lokasi));
        body.append(el('h3', null, e.judul), meta);
        if (e.ket) body.appendChild(el('p', null, e.ket));
        const u = safeUrl(e.link);
        if (u) body.appendChild(linkEl(u, 'Detail \u2192'));
        card.append(dt, body);
        box.appendChild(card);
      });
    }
    draw(upcoming, false);

    if (past.length) {
      const btn = el('button', 'btn', showPast ? 'Sembunyikan event yang sudah lewat' : 'Tampilkan event yang sudah lewat (' + past.length + ')');
      btn.type = 'button';
      btn.addEventListener('click', function () { showPast = !showPast; renderEvents(); });
      box.appendChild(btn);
      if (showPast) draw(past, true);
    }
  }

  /* ---------- Ambil data ---------- */
  function load() {
    if (!/^https:\/\/script\.google\.com\//.test(API_URL)) {
      setMsg('Backend belum dihubungkan. Isi API_URL di index.html dengan URL web app (…/exec).');
      return;
    }
    fetch(API_URL)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        renderNews(d.news || []);
        EVENTS = d.events || [];
        renderEvents();
      })
      .catch(function () { setMsg('Data belum dapat dimuat. Muat ulang halaman, atau hubungi admin.'); });
  }

  const start = location.hash.replace('#', '');
  showPane(start === 'news' || start === 'event' ? start : 'dash');
  load();
  </script>

  <script>
  /* ====== Jam & Cuaca setempat (GPS, cadangan IP) — data cuaca: Open-Meteo ====== */
  (function () {
    var $ = function (id) { return document.getElementById(id); };

    /* Jam */
    var dFmt = new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
    var tFmt = new Intl.DateTimeFormat('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZoneName: 'short' });
    function tick() {
      var n = new Date();
      $('ck-date').textContent = dFmt.format(n);
      $('ck-time').textContent = tFmt.format(n);
    }
    tick();
    setInterval(tick, 1000);

    /* Util */
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    function getJSON(url) {
      return fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
    }
    function setStatus(msg) {
      var box = $('wx-body');
      box.textContent = '';
      box.appendChild(el('p', 'wx-d', msg));
      $('wx-chip-t').textContent = /^Memuat/.test(msg) ? 'Memuat cuaca…' : 'Cuaca tidak tersedia';
    }
    function wmo(c, day) {
      if (c === 0) return { t: 'Cerah', i: day ? '☀️' : '🌙' };
      if (c === 1) return { t: 'Cerah berawan', i: day ? '🌤️' : '🌙' };
      if (c === 2) return { t: 'Berawan sebagian', i: '⛅' };
      if (c === 3) return { t: 'Berawan', i: '☁️' };
      if (c === 45 || c === 48) return { t: 'Berkabut', i: '🌫️' };
      if (c >= 51 && c <= 57) return { t: 'Gerimis', i: '🌦️' };
      if (c >= 61 && c <= 65) return { t: c === 61 ? 'Hujan ringan' : c === 63 ? 'Hujan sedang' : 'Hujan lebat', i: '🌧️' };
      if (c === 66 || c === 67) return { t: 'Hujan es', i: '🌧️' };
      if ((c >= 71 && c <= 77) || c === 85 || c === 86) return { t: 'Salju', i: '❄️' };
      if (c >= 80 && c <= 82) return { t: c === 80 ? 'Hujan lokal ringan' : c === 81 ? 'Hujan lokal' : 'Hujan lokal lebat', i: '🌦️' };
      if (c >= 95) return { t: 'Badai petir', i: '⛈️' };
      return { t: 'Tidak diketahui', i: '🌡️' };
    }

    /* Lokasi: GPS */
    function gpsLocate() {
      return new Promise(function (res, rej) {
        if (!navigator.geolocation) return rej(new Error('nogeo'));
        navigator.geolocation.getCurrentPosition(
          function (p) { res({ lat: p.coords.latitude, lon: p.coords.longitude }); },
          rej,
          { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 }
        );
      }).then(function (c) {
        var u = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + c.lat + '&longitude=' + c.lon + '&localityLanguage=id';
        return getJSON(u).then(function (g) {
          var n = [g.locality || g.city, g.principalSubdivision].filter(Boolean).join(', ');
          return { lat: c.lat, lon: c.lon, name: n || 'Lokasi Anda', src: 'Lokasi GPS' };
        }).catch(function () {
          return { lat: c.lat, lon: c.lon, name: 'Lokasi Anda', src: 'Lokasi GPS' };
        });
      });
    }

    /* Lokasi: IP (cadangan) */
    function ipLocate() {
      function pack(d) {
        if (!d || d.latitude == null || d.longitude == null || d.success === false) throw new Error('ip');
        return { lat: +d.latitude, lon: +d.longitude, name: [d.city, d.region].filter(Boolean).join(', ') || 'Lokasi Anda', src: 'Perkiraan lokasi via IP' };
      }
      return getJSON('https://ipwho.is/').then(pack).catch(function () {
        return getJSON('https://ipapi.co/json/').then(pack);
      });
    }

    /* Cuaca */
    function render(loc, w) {
      var c = w.current, d = w.daily;
      var info = wmo(c.weather_code, c.is_day === 1);
      var box = $('wx-body');
      box.textContent = '';
      $('wx-chip-t').textContent = info.i + ' ' + Math.round(c.temperature_2m) + '°C · ' + loc.name.split(',')[0];

      box.appendChild(el('p', 'wx-loc', loc.name));
      box.appendChild(el('p', 'wx-d', loc.src));

      var main = el('div', 'wx-main');
      var ic = el('span', 'wx-ic', info.i); ic.setAttribute('aria-hidden', 'true');
      var tw = el('div');
      tw.append(el('div', 'wx-t', Math.round(c.temperature_2m) + '°C'), el('p', 'wx-d', info.t));
      main.append(ic, tw);
      box.appendChild(main);

      var rows = [
        ['Hari ini', Math.round(d.temperature_2m_min[0]) + '° – ' + Math.round(d.temperature_2m_max[0]) + '°C'],
        ['Terasa seperti', Math.round(c.apparent_temperature) + '°C'],
        ['Kelembapan', Math.round(c.relative_humidity_2m) + '%'],
        ['Angin', Math.round(c.wind_speed_10m) + ' km/jam']
      ];
      if (d.precipitation_probability_max && d.precipitation_probability_max[0] != null) {
        rows.push(['Peluang hujan', Math.round(d.precipitation_probability_max[0]) + '%']);
      }
      var dl = el('dl');
      rows.forEach(function (r) { dl.append(el('dt', null, r[0]), el('dd', null, r[1])); });
      box.appendChild(dl);

      var days = el('div', 'wx-days');
      var wk = new Intl.DateTimeFormat('id-ID', { weekday: 'short' });
      for (var i = 1; i <= 3 && i < d.time.length; i++) {
        var p = d.time[i].split('-');
        var dayInfo = wmo(d.weather_code[i], true);
        var cell = el('div');
        var ico = el('i', null, dayInfo.i); ico.setAttribute('aria-hidden', 'true'); ico.title = dayInfo.t;
        cell.append(el('b', null, wk.format(new Date(+p[0], +p[1] - 1, +p[2]))), ico,
          el('span', null, Math.round(d.temperature_2m_min[i]) + '°/' + Math.round(d.temperature_2m_max[i]) + '°'));
        days.appendChild(cell);
      }
      box.appendChild(days);
      box.appendChild(el('p', 'wx-d', 'Data: Open-Meteo'));
    }

    function loadWeather(loc) {
      var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat.toFixed(3) + '&longitude=' + loc.lon.toFixed(3) +
        '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
        '&timezone=auto&forecast_days=4';
      return getJSON(u).then(function (w) { render(loc, w); });
    }

    /* Alur: tampilkan perkiraan IP segera, lalu perhalus dengan GPS bila diizinkan */
    var current = null, gpsOk = false;
    function show(loc) {
      current = loc;
      loadWeather(loc).catch(function () { setStatus('Data cuaca belum dapat dimuat. Coba klik Perbarui lokasi.'); });
    }
    function init() {
      gpsOk = false;
      setStatus('Memuat cuaca…');
      var gpsP = gpsLocate().then(function (l) { gpsOk = true; show(l); }).catch(function () {});
      ipLocate().then(function (l) { if (!gpsOk) show(l); }).catch(function () {
        gpsP.then(function () {
          if (!gpsOk) setStatus('Lokasi tidak tersedia. Izinkan akses lokasi pada browser, lalu klik Perbarui lokasi.');
        });
      });
    }

    var chip = $('wx-chip'), pop = $('wx-pop');
    function togglePop(open) {
      pop.hidden = !open;
      chip.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    chip.addEventListener('click', function (e) { e.stopPropagation(); togglePop(pop.hidden); });
    pop.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', function () { togglePop(false); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { togglePop(false); chip.focus(); } });

    $('wx-refresh').addEventListener('click', init);
    setInterval(function () { if (current) loadWeather(current).catch(function () {}); }, 15 * 60 * 1000);
    init();
  })();
  </script>
